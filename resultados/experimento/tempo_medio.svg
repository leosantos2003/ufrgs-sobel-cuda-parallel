  <title id="titulo">Tempo médio de processamento por resolução</title>
  <desc id="descricao">Linhas para CPU e GPU em escala logarítmica. As barras verticais mostram um desvio-padrão entre cinco tentativas.</desc>
  <style>text { font-family: Arial, Helvetica, sans-serif; fill: #1F2937; } .grade { stroke: #D1D5DB; stroke-width: 1; } .eixo { stroke: #374151; stroke-width: 1.5; } .rotulo { font-size: 18px; } .pequeno { font-size: 15px; fill: #4B5563; } .titulo { font-size: 28px; font-weight: 700; } .subtitulo { font-size: 17px; fill: #4B5563; }</style>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text class="titulo" x="130" y="53">Tempo médio de processamento por resolução</text>
  <text class="subtitulo" x="130" y="82">Escala logarítmica: revela CPU e GPU apesar de tempos em ordens de grandeza diferentes.</text>
  <text class="subtitulo" x="130" y="108">Barras = ±1 desvio-padrão (5 tentativas; 30 repetições internas cada).</text>
