<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Speedup da GPU em relação à CPU</title>
  <desc id="descricao">Linha do speedup CPU dividido por GPU. A referência 1 indica tempos iguais; valores maiores favorecem a GPU.</desc>
  <style>text { font-family: Arial, Helvetica, sans-serif; fill: #1F2937; } .grade { stroke: #D1D5DB; stroke-width: 1; } .eixo { stroke: #374151; stroke-width: 1.5; } .rotulo { font-size: 18px; } .pequeno { font-size: 15px; fill: #4B5563; } .titulo { font-size: 28px; font-weight: 700; } .subtitulo { font-size: 17px; fill: #4B5563; }</style>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text class="titulo" x="130" y="53">Speedup da GPU em relação à CPU</text>
  <text class="subtitulo" x="130" y="82">Speedup = tempo médio da CPU ÷ tempo médio da GPU. Valores acima de 1 favorecem a GPU.</text>
  <line class="grade" x1="130" y1="585.0" x2="1010" y2="585.0"/>
  <text class="pequeno" x="116" y="590.0" text-anchor="end">0.000</text>
  <line class="grade" x1="130" y1="497.0" x2="1010" y2="497.0"/>
  <text class="pequeno" x="116" y="502.0" text-anchor="end">40.0</text>
  <line class="grade" x1="130" y1="409.0" x2="1010" y2="409.0"/>
  <text class="pequeno" x="116" y="414.0" text-anchor="end">80.0</text>
  <line class="grade" x1="130" y1="321.0" x2="1010" y2="321.0"/>
  <text class="pequeno" x="116" y="326.0" text-anchor="end">120</text>
  <line class="grade" x1="130" y1="233.0" x2="1010" y2="233.0"/>
  <text class="pequeno" x="116" y="238.0" text-anchor="end">160</text>
  <line class="grade" x1="130" y1="145.0" x2="1010" y2="145.0"/>
  <text class="pequeno" x="116" y="150.0" text-anchor="end">200</text>
  <line class="eixo" x1="130" y1="145" x2="130" y2="585"/>
  <line class="eixo" x1="130" y1="585" x2="1010" y2="585"/>
  <line class="eixo" x1="130.0" y1="585" x2="130.0" y2="592"/>
  <text class="pequeno" x="130.0" y="614" text-anchor="middle">256 × 256</text>
  <line class="eixo" x1="350.0" y1="585" x2="350.0" y2="592"/>
  <text class="pequeno" x="350.0" y="614" text-anchor="middle">512 × 512</text>
  <line class="eixo" x1="570.0" y1="585" x2="570.0" y2="592"/>
  <text class="pequeno" x="570.0" y="614" text-anchor="middle">1024 × 1024</text>
  <line class="eixo" x1="790.0" y1="585" x2="790.0" y2="592"/>
  <text class="pequeno" x="790.0" y="614" text-anchor="middle">2048 × 2048</text>
  <line class="eixo" x1="1010.0" y1="585" x2="1010.0" y2="592"/>
  <text class="pequeno" x="1010.0" y="614" text-anchor="middle">4096 × 4096</text>
  <text class="rotulo" x="570.0" y="659" text-anchor="middle">Resolução da imagem (pixels)</text>
  <text class="rotulo" transform="translate(29 365.0) rotate(-90)" text-anchor="middle">Speedup (×)</text>
  <line x1="130" y1="582.8" x2="1010" y2="582.8" stroke="#374151" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="pequeno" x="1005" y="573.8" text-anchor="end">referência: 1×</text>
  <polyline points="130.0,520.6 350.0,499.5 570.0,376.9 790.0,454.7 1010.0,445.6" fill="none" stroke="#009E73" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="130.0" cy="520.6" r="6" fill="#FFFFFF" stroke="#009E73" stroke-width="3"/>
  <circle cx="350.0" cy="499.5" r="6" fill="#FFFFFF" stroke="#009E73" stroke-width="3"/>
  <circle cx="570.0" cy="376.9" r="6" fill="#FFFFFF" stroke="#009E73" stroke-width="3"/>
  <circle cx="790.0" cy="454.7" r="6" fill="#FFFFFF" stroke="#009E73" stroke-width="3"/>
  <circle cx="1010.0" cy="445.6" r="6" fill="#FFFFFF" stroke="#009E73" stroke-width="3"/>
  <text x="1025.0" y="431.6" font-size="18" font-weight="700" style="fill: #009E73;">speedup</text>
  <text class="pequeno" x="130.0" y="507.6" text-anchor="middle">29.25×</text>
  <text class="pequeno" x="350.0" y="486.5" text-anchor="middle">38.86×</text>
  <text class="pequeno" x="570.0" y="363.9" text-anchor="middle">94.60×</text>
  <text class="pequeno" x="790.0" y="441.7" text-anchor="middle">59.23×</text>
  <text class="pequeno" x="1010.0" y="432.6" text-anchor="middle">63.37×</text>
</svg>
